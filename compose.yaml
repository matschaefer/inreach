name: inreach
services:
  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      INREACH_BIND_ADDRESS: 0.0.0.0
      INREACH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobplatform_crawler}
      POSTGRES_USER: ${POSTGRES_USER:-jobplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      INREACH_INGESTION_TOKEN: ${INREACH_INGESTION_TOKEN:?INREACH_INGESTION_TOKEN fehlt}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-jobplatform_crawler}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
    external: true
    name: ${INREACH_POSTGRES_VOLUME:-job-platform_postgres_data}
  redis_data:
    external: true
    name: ${INREACH_REDIS_VOLUME:-job-platform_redis_data}
