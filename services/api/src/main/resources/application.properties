spring.application.name=inreach-api
server.address=${INREACH_BIND_ADDRESS:127.0.0.1}
server.port=${INREACH_API_PORT:8080}
spring.datasource.url=${INREACH_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/jobplatform_crawler}
spring.datasource.username=${POSTGRES_USER:jobplatform}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
logging.structured.format.console=logstash
server.error.include-message=never
spring.mvc.problemdetails.enabled=true
server.tomcat.max-http-form-post-size=20MB
